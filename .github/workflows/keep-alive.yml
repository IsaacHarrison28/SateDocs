name: Wake Server

on:
  schedule:
    # Runs every 10 minutes. This is well below Render's 15-minute timeout.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SateDocs Server
        run: |
          curl -sSf -o /dev/null "${{ secrets.RENDER_SERVER_URL }}/api/health"
